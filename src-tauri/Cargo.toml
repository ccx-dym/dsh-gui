[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
ed25519-dalek = "=3.0.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls-no-alpn", "stream"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"
zip = { version = "=8.4.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
